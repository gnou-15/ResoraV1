name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

  backend-node-ci:
    name: Backend Node.js (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend-node/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Unit Tests
        run: npm test

  backend-python-ci:
    name: Backend Python (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend-python/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: ruff check test_main.py

      - name: Run Pytest Execution
        run: pytest

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Audit Node Backend Dependencies
        working-directory: ./backend-node
        run: npm audit --audit-level=high || true

      - name: Setup Python & Audit Python Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Pip Audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend-python/requirements.txt || true

  ci-summary:
    name: CI Pipeline Quality Gate
    needs: [frontend-ci, backend-node-ci, backend-python-ci, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Parallel Jobs Passed
        run: |
          if [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.backend-node-ci.result }}" != "success" ] || \
             [ "${{ needs.backend-python-ci.result }}" != "success" ]; then
            echo "❌ One or more CI jobs failed!"
            exit 1
          fi
          echo "✅ All CI parallel jobs passed successfully!"
