name: Continuous Delivery (CD) Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_PYTHON: ghcr.io/gnou-15/resorav1/backend-python
  IMAGE_NODE: ghcr.io/gnou-15/resorav1/backend-node

jobs:
  build-and-push-artifacts:
    name: Deployment Automation (Build & Publish Artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata & semantic tags for Python Backend
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PYTHON }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & Push Python Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-python
          push: true
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata & semantic tags for Node Backend
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NODE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & Push Node Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-security-scan:
    name: Container Security Scanning (Trivy)
    needs: [build-and-push-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Python Backend Container for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PYTHON }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan Node Backend Container for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NODE }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  end-to-end-validation-gate:
    name: End-to-End Validation & Health Gate
    needs: [build-and-push-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Run Python Backend Container
        run: |
          docker run -d --name python-health-check -p 8000:8000 ${{ env.IMAGE_PYTHON }}:latest
          sleep 5

      - name: Pull and Run Node Backend Container
        run: |
          docker run -d --name node-health-check -p 5000:5000 ${{ env.IMAGE_NODE }}:latest
          sleep 5

      - name: Verify Python Backend Health Endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Python Health Check Response: $RESPONSE"
          if [[ "$RESPONSE" == *"online"* ]]; then
            echo "✅ Python Backend Health Validation Passed!"
          else
            echo "❌ Python Backend Health Validation Failed!"
            exit 1
          fi

      - name: Verify Node Backend Health Endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:5000/health)
          echo "Node Health Check Response: $RESPONSE"
          if [[ "$RESPONSE" == *"online"* ]]; then
            echo "✅ Node Backend Health Validation Passed!"
          else
            echo "❌ Node Backend Health Validation Failed!"
            exit 1
          fi

  post-deployment-verification:
    name: Production Deployment & Live Post-Verification (Page 5)
    needs: [end-to-end-validation-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deployment Webhooks (If Configured)
        run: |
          if [ -n "${{ secrets.RENDER_PYTHON_DEPLOY_HOOK }}" ]; then
            echo "🚀 Triggering Render Python Backend Deployment..."
            curl -s -X POST "${{ secrets.RENDER_PYTHON_DEPLOY_HOOK }}"
          else
            echo "ℹ️ RENDER_PYTHON_DEPLOY_HOOK secret not set. Skipping webhook trigger."
          fi

          if [ -n "${{ secrets.RENDER_NODE_DEPLOY_HOOK }}" ]; then
            echo "🚀 Triggering Render Node Backend Deployment..."
            curl -s -X POST "${{ secrets.RENDER_NODE_DEPLOY_HOOK }}"
          else
            echo "ℹ️ RENDER_NODE_DEPLOY_HOOK secret not set. Skipping webhook trigger."
          fi

      - name: Verify Live Production Domain (nezer-resora.com)
        run: |
          echo "🌐 Performing Post-Deployment Verification ping against nezer-resora.com..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://nezer-resora.com || true)
          echo "Live Domain HTTP Status Code: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 301 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "✅ Live Production Domain (nezer-resora.com) Verified Successfully!"
          else
            echo "⚠️ Production domain returned status code $RESPONSE. Verification logged."
          fi
