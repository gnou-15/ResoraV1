events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format loadbalancer '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr ($upstream_response_time s)';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for 1,000+ users bandwidth efficiency
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Maximum file upload size (support PDF/Word resumes up to 25MB)
    client_max_body_size 25M;

    # Rate Limiting Zone: 30 requests/second with a burst of 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream backend clusters
    upstream backend_python_cluster {
        least_conn; # Distribute to container with fewest active connections
        server backend-python:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_node_cluster {
        server backend-node:5000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream frontend_cluster {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for AI processing & document parsing
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Load Balancer Health Check
        location = /lb-health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"Resora Nginx Load Balancer","target_capacity":"1000+ users"}';
        }

        # Node.js Backend API routes
        location /api/node/ {
            rewrite ^/api/node/(.*) /$1 break;
            proxy_pass http://backend_node_cluster;
        }

        # Python Backend explicit API prefix
        location /api/py/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/py/(.*) /$1 break;
            proxy_pass http://backend_python_cluster;
        }

        # Direct Python Backend API endpoints for backward-compatibility
        location ~ ^/(health|extract-text|score-resume|generate-suggestions|generate-full-resume|check-ats-friendly|improve-bullet-point|summarize-section|suggest-skills|analyze-job-match|ats-parse-preview|calculate-metrics) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_python_cluster;
        }

        # Frontend SPA & Static Assets (Default fallback)
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
